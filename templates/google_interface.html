<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        
        .search-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        
        .logo {
            margin-bottom: 30px;
            font-size: 50px;
            font-weight: bold;
            color: #4285F4;
        }
        
        .logo span:nth-child(1) { color: #4285F4; }
        .logo span:nth-child(2) { color: #EA4335; }
        .logo span:nth-child(3) { color: #FBBC05; }
        .logo span:nth-child(4) { color: #4285F4; }
        .logo span:nth-child(5) { color: #34A853; }
        .logo span:nth-child(6) { color: #EA4335; }
        
        .search-box {
            display: flex;
            width: 100%;
            margin-bottom: 30px;
        }
        
        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            font-size: 16px;
            outline: none;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.1);
        }
        
        .search-input:hover,
        .search-input:focus {
            box-shadow: 0 1px 10px rgba(32, 33, 36, 0.2);
        }
        
        .buttons {
            display: flex;
            gap: 12px;
        }
        
        .button {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 10px 16px;
            cursor: pointer;
        }
        
        .button:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
        }
        
        .file-upload {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .upload-button {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .upload-button:hover {
            background-color: #357ae8;
        }
        
        .results-container {
            display: none;
            flex-direction: column;
            width: 100%;
            padding: 20px;
        }
        
        .search-header {
            display: flex;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #dfe1e5;
        }
        
        .header-logo {
            font-size: 24px;
            font-weight: bold;
            margin-right: 20px;
        }
        
        .header-search {
            flex: 1;
            max-width: 600px;
        }
        
        .search-results {
            padding: 20px;
            max-width: 700px;
        }
        
        .result-item {
            margin-bottom: 25px;
        }
        
        .result-title {
            font-size: 18px;
            color: #1a0dab;
            text-decoration: none;
            margin-bottom: 5px;
            display: block;
        }
        
        .result-snippet {
            font-size: 14px;
            color: #4d5156;
            line-height: 1.5;
        }
        
        .loading-indicator {
            display: none;
            margin-top: 20px;
            text-align: center;
        }
        
        footer {
            background-color: #f2f2f2;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #70757a;
        }
        
        /* Chat section */
        .chat-container {
            display: none;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .chat-messages {
            border: 1px solid #dfe1e5;
            border-radius: 8px;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #f8f9fa;
        }
        
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 18px;
            max-width: 70%;
            word-wrap: break-word;
        }
        
        .user-message {
            background-color: #e3f2fd;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        
        .bot-message {
            background-color: #f1f3f4;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        
        .chat-input-container {
            display: flex;
            gap: 10px;
        }
        
        .chat-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
        }
        
        .send-button {
            background-color: #4285F4;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <!-- Main Search Page -->
    <div class="container" id="main-container">
        <div class="search-container">
            <div class="logo">
                <span>D</span><span>o</span><span>c</span><span>S</span><span>e</span><span>arch</span>
            </div>
            <div class="search-box">
                <input type="text" class="search-input" id="search-input" placeholder="Search your documents...">
            </div>
            <div class="buttons">
                <button class="button" id="search-button">Document Search</button>
                <button class="button" id="chat-mode-button">Chat Mode</button>
            </div>
            
            <div class="file-upload">
                <label for="file-input">Upload your documents:</label>
                <input type="file" id="file-input" multiple>
                <button class="upload-button" id="upload-button">Upload & Process</button>
                <div id="upload-status"></div>
            </div>
        </div>
    </div>
    
    <!-- Results Page -->
    <div class="results-container" id="results-container">
        <div class="search-header">
            <div class="header-logo">
                <span style="color: #4285F4;">D</span><span style="color: #EA4335;">o</span><span style="color: #FBBC05;">c</span><span style="color: #4285F4;">S</span><span style="color: #34A853;">e</span><span style="color: #EA4335;">arch</span>
            </div>
            <div class="header-search">
                <input type="text" class="search-input" id="header-search-input">
            </div>
        </div>
        
        <div class="search-results" id="search-results">
            <!-- Results will be inserted here -->
        </div>
        
        <div class="loading-indicator" id="loading-indicator">
            Searching...
        </div>
    </div>
    
    <!-- Chat Interface -->
    <div class="chat-container" id="chat-container">
        <div class="search-header">
            <div class="header-logo">
                <span style="color: #4285F4;">D</span><span style="color: #EA4335;">o</span><span style="color: #FBBC05;">c</span><span style="color: #4285F4;">S</span><span style="color: #34A853;">e</span><span style="color: #EA4335;">arch</span>
            </div>
            <button class="button" id="back-to-search">Back to Search</button>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message bot-message">
                Hello! I'm ready to answer questions about your documents. What would you like to know?
            </div>
        </div>
        
        <div class="chat-input-container">
            <input type="text" class="chat-input" id="chat-input" placeholder="Ask a question...">
            <button class="send-button" id="send-button">→</button>
        </div>
    </div>
    
    <footer>
        © 2025 DocSearch - Powered by NVIDIA AI & LlamaIndex
    </footer>
    
    <script>
        // DOM Elements
        const mainContainer = document.getElementById('main-container');
        const resultsContainer = document.getElementById('results-container');
        const chatContainer = document.getElementById('chat-container');
        const searchInput = document.getElementById('search-input');
        const headerSearchInput = document.getElementById('header-search-input');
        const searchButton = document.getElementById('search-button');
        const chatModeButton = document.getElementById('chat-mode-button');
        const searchResults = document.getElementById('search-results');
        const loadingIndicator = document.getElementById('loading-indicator');
        const fileInput = document.getElementById('file-input');
        const uploadButton = document.getElementById('upload-button');
        const uploadStatus = document.getElementById('upload-status');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendButton = document.getElementById('send-button');
        const backToSearchButton = document.getElementById('back-to-search');
        
        // Variables
        let documentsLoaded = false;
        
        // Event Listeners
        searchButton.addEventListener('click', handleSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });
        
        headerSearchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleHeaderSearch();
        });
        
        chatModeButton.addEventListener('click', () => {
            if (!documentsLoaded) {
                alert('Please upload documents first!');
                return;
            }
            showChatInterface();
        });
        
        uploadButton.addEventListener('click', handleDocumentUpload);
        
        sendButton.addEventListener('click', handleChatMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleChatMessage();
        });
        
        backToSearchButton.addEventListener('click', () => {
            mainContainer.style.display = 'flex';
            resultsContainer.style.display = 'none';
            chatContainer.style.display = 'none';
        });
        
        // Functions
        function handleSearch() {
            if (!documentsLoaded) {
                alert('Please upload documents first!');
                return;
            }
            
            const query = searchInput.value.trim();
            if (!query) return;
            
            mainContainer.style.display = 'none';
            resultsContainer.style.display = 'flex';
            headerSearchInput.value = query;
            
            // Show loading indicator
            loadingIndicator.style.display = 'block';
            searchResults.innerHTML = '';
            
            // Simulate search (replace with actual API call)
            setTimeout(() => {
                // Hide loading indicator
                loadingIndicator.style.display = 'none';
                
                // Mock results - would be replaced with actual search results
                const mockResults = [
                    {
                        title: "Document Section 1",
                        snippet: "This section contains relevant information about your query. The matching text would be highlighted here with the context around it."
                    },
                    {
                        title: "Document Section 2",
                        snippet: "Another relevant section from your documents that matches the search criteria. This would show the surrounding context of the matching text."
                    },
                    {
                        title: "Document Section 3",
                        snippet: "Additional information from your documents that might be helpful in answering your query."
                    }
                ];
                
                displaySearchResults(mockResults);
            }, 1500);
        }
        
        function handleHeaderSearch() {
            const query = headerSearchInput.value.trim();
            if (!query) return;
            
            // Show loading indicator
            loadingIndicator.style.display = 'block';
            searchResults.innerHTML = '';
            
            // Simulate search (replace with actual API call)
            setTimeout(() => {
                // Hide loading indicator
                loadingIndicator.style.display = 'none';
                
                // Mock results
                const mockResults = [
                    {
                        title: "Document Section 1",
                        snippet: "This section contains relevant information about your new query. The matching text would be highlighted here."
                    },
                    {
                        title: "Document Section 2",
                        snippet: "Another relevant section matching your new search criteria."
                    }
                ];
                
                displaySearchResults(mockResults);
            }, 1500);
        }
        
        function displaySearchResults(results) {
            results.forEach(result => {
                const resultElement = document.createElement('div');
                resultElement.className = 'result-item';
                
                const titleElement = document.createElement('a');
                titleElement.className = 'result-title';
                titleElement.textContent = result.title;
                titleElement.href = '#';
                titleElement.addEventListener('click', (e) => {
                    e.preventDefault();
                    // Navigate to chat with this context
                    showChatInterface();
                    addBotMessage(`You're looking at: ${result.title}. How can I help you understand this content?`);
                });
                
                const snippetElement = document.createElement('div');
                snippetElement.className = 'result-snippet';
                snippetElement.textContent = result.snippet;
                
                resultElement.appendChild(titleElement);
                resultElement.appendChild(snippetElement);
                searchResults.appendChild(resultElement);
            });
        }
        
        function handleDocumentUpload() {
            if (!fileInput.files.length) {
                alert('Please select files to upload!');
                return;
            }
            
            uploadStatus.textContent = 'Uploading and processing documents...';
            
            // Simulate document processing (replace with actual API call)
            setTimeout(() => {
                documentsLoaded = true;
                uploadStatus.textContent = `Successfully loaded ${fileInput.files.length} documents.`;
            }, 2000);
        }
        
        function showChatInterface() {
            mainContainer.style.display = 'none';
            resultsContainer.style.display = 'none';
            chatContainer.style.display = 'block';
        }
        
        function handleChatMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            
            // Add user message
            addUserMessage(message);
            chatInput.value = '';
            
            // Simulate bot response (replace with actual API call)
            setTimeout(() => {
                // Mock response
                const mockResponse = "Based on your documents, I found the following information: " + 
                    "The information you're looking for appears in section 3.2 of your document. " +
                    "It states that the process involves three main steps: data preparation, analysis, and reporting. " +
                    "Would you like me to elaborate on any of these steps?";
                
                addBotMessage(mockResponse);
            }, 1000);
        }
        
        function addUserMessage(text) {
            const messageElement = document.createElement('div');
            messageElement.className = 'message user-message';
            messageElement.textContent = text;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function addBotMessage(text) {
            const messageElement = document.createElement('div');
            messageElement.className = 'message bot-message';
            messageElement.textContent = text;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
